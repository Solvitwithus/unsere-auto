# nginx in front of wb-server, with HTTPS from Let's Encrypt.
#   sudo cp nginx-weighbridge.conf /etc/nginx/sites-available/weighbridge
#   sudo ln -s /etc/nginx/sites-available/weighbridge /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d weighbridge.example.com
server {
    listen 80;
    server_name weighbridge.example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
